<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração | FACA NA CAVEIRA MG</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png"> 
    <style>
        /* Estilos adicionais para o formulário de login */
        .login-box {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            /* Usando fundo semi-transparente como o secao-padrao, mas com opacidade maior */
            background-color: rgba(0, 0, 0, 0.9);
            border-radius: 8px;
            text-align: center;
            border: 2px solid var(--cor-vermelho);
        }
        .login-box h2 {
            margin-bottom: 20px;
            color: var(--cor-amarelo);
            font-family: var(--fonte-titulo);
        }
        .login-box input[type="password"] {
            width: 80%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #333;
            border-radius: 4px;
            background-color: #222;
            color: var(--cor-branco);
            font-size: 1.1em;
            text-align: center;
        }
        .login-box button {
            background-color: var(--cor-vermelho);
            color: var(--cor-branco);
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-family: var(--fonte-titulo);
        }
        .login-box button:hover {
            background-color: #cc0000;
        }

        /* Estilos para o menu administrativo após o login */
        .admin-menu {
            max-width: 600px;
            margin: 50px auto;
            padding: 40px;
            background-color: rgba(0, 0, 0, 0.9);
            border-radius: 8px;
            border: 2px solid var(--cor-vermelho);
            text-align: center;
        }
        .admin-menu h2 {
            margin-bottom: 30px;
            color: var(--cor-amarelo);
            font-family: var(--fonte-titulo);
        }
        .admin-menu button {
            display: block;
            width: 90%;
            margin: 10px auto;
            background-color: var(--cor-vermelho);
            color: var(--cor-branco);
            border: none;
            padding: 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            font-family: var(--fonte-titulo);
            font-size: 1.1em;
            text-transform: uppercase;
        }
        .admin-menu button:hover {
            background-color: #cc0000;
            transform: scale(1.02);
        }
        .info-link {
            margin-top: 30px;
            padding: 15px;
            border-top: 1px solid rgba(255, 0, 0, 0.5);
            color: var(--cor-amarelo);
        }
    </style>
</head>
<body>

    <header class="cabecalho">
        <div class="logo-container">
            <a href="index.html"><img src="FACA.jpg" alt="Logo Motogrupo Faca na Caveira MG RJ-BRASIL" class="logo"></a>
        </div>
        <nav class="menu-principal">
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="galeria.html">GALERIA</a></li>
                <li><a href="historia.html">HISTÓRIA</a></li>
                <li><a href="rotas.html">EVENTOS FACA NA CAVEIRA </a></li>
                <li><a href="irmandade.html">IRMANDADE</a></li>
                <li><a href="aniversariantes.html">ANIVERSARIANTES</a></li>
                <li><a href="contato.html">CONTATO</a></li>
                <li><a href="administracao.html" class="ativo">ADMINISTRAÇÃO</a></li>
            </ul>
        </nav>
    </header>

    <main class="secao-padrao">
        <div id="login-box" class="login-box">
            <h2>ACESSO RESTRITO</h2>
            <input type="password" id="adminPassword" placeholder="Digite a Senha de Administrador" onkeydown="handleKey(event)">
            <button onclick="checkPassword()">ENTRAR</button>
        </div>

        <div id="admin-menu" class="admin-menu" style="display: none;">
            <h2>MENU ADMINISTRATIVO</h2>
            
            <button onclick="window.location.href='documentacao_admin.html'">DOCUMENTAÇÃO DE ADMINISTRAÇÃO</button>

            <button onclick="acessarPlanilha()">PLANILHA FINANCEIRA (DIRETOR FINACEIRO)</button>
            <button onclick="acessarControlePagamentos()">CONTROLE DE PAGAMENTOS (DIRETOR FINANCEIRO)</button>
            
            <button onclick="acessarGaleria()">ATUALIZAÇÃO DA GALERIA FOTOS (DIRETOR SOCIAL)</button>
            
           


        </div>
    </main>

    <footer class="rodape">
       <p>&copy; 2013 - 2025 FACA NA CAVEIRA MG | RJ-BRASIL</p>
    </footer>

    <script>
        // *** CREDENCIAIS MANTIDAS ***
        const CORRECT_PASSWORD = "adsumus";
        const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/1IRiUE7ibA3Nk_F50sMvrbKHsBb-kDVJJ2FU9Lf-mMBI/edit?usp=sharing";
        const PAGAMENTOS_URL = "https://script.google.com/macros/s/AKfycby1fEFleMghx22rDHQVcBMhjeua7fdPEt6wTOuNI_TXQ5UaV2Cv0kHY_c0_mupJ-H7yww/exec";
       
        // Função para verificar se a tecla pressionada é ENTER (desktop)
        function handleKey(event) {
            // Código da tecla 13 é o ENTER
            if (event.keyCode === 13) {
                checkPassword();
            }
        }

        // Função principal chamada pelo botão ou pela tecla ENTER
        function checkPassword() {
            const input = document.getElementById('adminPassword').value;

            if (input === CORRECT_PASSWORD) {
                // Senha correta, mostra o menu administrativo
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('admin-menu').style.display = 'block';
            } else {
                // Senha incorreta
                alert("ACESSO NEGADO: Senha de administrador incorreta.");
                document.getElementById('adminPassword').value = ''; // Limpa o campo
            }
        }

        function acessarPlanilha() {
            window.location.href = GOOGLE_SHEET_URL;
        }

        function acessarControlePagamentos() {
            window.location.href = PAGAMENTOS_URL;
        }

        function acessarGaleria() {
            window.location.href ="https://script.google.com/macros/s/AKfycbzQ0-1aNZ3pyaN8CPALdPiW76YDrnQastxJzDRn9VqxuGJ4NTWKfuBGRmDqyDvk1W2i/exec";    }
    </script>

</body>
</html>
