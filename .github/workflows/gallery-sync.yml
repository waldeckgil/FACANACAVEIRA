name: Sincronização da Galeria (6h)

on:
  # Define a frequência de execução a cada 6 horas (0h, 6h, 12h, 18h UTC)
  schedule:
    - cron: '0 */6 * * *'
  # Permite que você inicie manualmente a sincronização pelo painel do GitHub
  workflow_dispatch:

jobs:
  sync:
    # Usa o ambiente padrão do Linux para rodar o Python
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout do Código
      # Baixa seu repositório para o ambiente de execução
      uses: actions/checkout@v4
      with:
        # Usa o token nativo para permitir que o Actions faça o push de volta
        token: ${{ secrets.GITHUB_TOKEN }} 

    - name: 2. Configurar Python
      # Configura o ambiente Python 3
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: 3. Instalar Dependências
      # Instala as bibliotecas requests e gdown
      run: pip install -r requirements.txt

    - name: 4. Executar o Script de Sincronização
      # Roda seu script Python. 
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: python sync_gallery.py