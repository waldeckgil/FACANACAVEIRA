    <link rel="stylesheet" href="style.css">

    <style>
        .secao-home {
            padding: 50px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .container-texto {
            text-align: center;
            margin-bottom: 20px;
        }
        .container-texto h2 {
            color: var(--cor-amarelo);
            font-family: var(--fonte-titulo);
            margin-bottom: 10px;
        }
        .container-texto p {
            color: var(--cor-branco);
            font-size: 1.1em;
            max-width: 800px;
            margin: 0 auto;
        }
        .datas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin: 0 auto;
            max-width: 1200px;
            justify-content: center;
        }
        .data-card {
            background-color: rgba(0, 0, 0, 0.9);
            border: 2px solid var(--cor-vermelho);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
            max-width: 300px;
            margin: 0 auto;
        }
        .data-card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.4);
        }
        .data-card img {
            width: 250px;
            height: 200px;
            border: 3px solid var(--cor-amarelo);
            margin-bottom: 15px;
            object-fit: cover;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .data-card h3 {
            color: var(--cor-amarelo);
            margin-bottom: 10px;
            font-family: var(--fonte-titulo);
            font-size: 1.3em;
            word-break: break-word;
        }
        .data-card p {
            color: var(--cor-branco);
            margin: 5px 0;
            font-size: 1em;
        }
        .data-aniversario {
            font-weight: bold;
            color: var(--cor-vermelho);
            font-size: 1.1em;
            margin-top: 10px;
        }
        .idade {
            color: var(--cor-amarelo);
            font-weight: bold;
            font-size: 1em;
            margin: 5px 0;
        }
        /* INÍCIO DAS ALTERAÇÕES PARA O LINK DO EVENTO */
        .link-evento {
            text-decoration: none; /* Remove sublinhado do link */
            color: inherit; /* Mantém a cor do texto do card */
            display: block; /* Garante que o link ocupe todo o espaço do card */
            cursor: pointer;
        }
        .link-evento:hover {
            /* Mantém o efeito visual do card, mas garante a aparência de link */
            opacity: 0.9;
        }
        /* FIM DAS ALTERAÇÕES PARA O LINK DO EVENTO */
    </style>
</head>
<body>

    <script>
        // Dados das datas comemorativas (apenas aquelas com foto em DATAS_COMEMORATIVAS_EVENTOS/)
        const datasComemorativas = [
            {
                //27-10
                "nome": "27 DE OUTUBRO ANIVERSÁRIO MOTOGRUPO FACA NA CAVEIRA - MG",
                "data": "27-10",
                "foto": "DATAS_COMEMORATIVAS_EVENTOS/FACA.png",
                "cargo": " ",
                "anoNascimento": 2013,
                "img_temp": "N"
            },
            {
                //27-07
                "nome": "27 DE JULHO DIA DO MOTOCICLISTA",
                "data": "27-07",
                "foto": "DATAS_COMEMORATIVAS_EVENTOS/DIA_MOTOCICICLSITA.jpg",
                "cargo": "",
                "anoNascimento": "",
                "img_temp": "N"
            },
            {
                //13-07
                "nome": "13 DE JULHO DIA MUNDIAL DO ROCK",
                "data": "13-07",
                "foto": "DATAS_COMEMORATIVAS_EVENTOS/DIA_ROCK.png",
                "cargo": "",
                "anoNascimento": "",
                "img_temp": "N"
            },
          
            {
                //           ***** EVENTO TEMPORARIO    *********************************
                "nome": "VIAGEM DO ROCK MOTO FEST - Tanguá - RJ 16 a 18 de Janeiro ",
                "data": "18-01-2025",
                "foto": "DATAS_COMEMORATIVAS_EVENTOS/eventos_2026.jpg",
                "cargo": "",
                "anoNascimento": "",
                "img_temp": "S" // Evento temporário que aparecerá apenas em 2025.
            },



          
            {
                "nome": "FACA NA CAVEIRA - MG  PARABENIZA  TODAS MULHERES APAIXONADAS PELO MOTOCICLISMO ",
                "data": "02-05",
                "foto": "DATAS_COMEMORATIVAS_EVENTOS/DIA_MULHER_MOTOCICLISTA.jpg",
                "cargo": "",
                "anoNascimento": "",
                "img_temp": "N"
            },
     



            {
                "nome": "20 DE NOVEMBRO DIA NACIONAL DA CONSCIÊNCIA NEGRA",
                "data": "20-11",
                "foto": "DATAS_COMEMORATIVAS_EVENTOS/CONSCIENCIA_NEGRA.png",
                "cargo": "",
                "anoNascimento": "",
                "img_temp": "N"
            },


            {
                "nome": "11  DE DEZEMBRO APRESENTAÇÃO DO SITE A DIRETORIA FACA NA CAVEIRA MG",
                "data": "11-12",
                "foto": "DATAS_COMEMORATIVAS_EVENTOS/FACA.jpg",
                "cargo": "",
                "anoNascimento": "",
                "img_temp": "N"
            },


            // ***** EVENTO FEVEREIRO 2026 *********************************
            {
                "nome": "26º Encontro Nacional de Motociclistas De 05 à 08 de Fevereiro ",
                "data": "08-12-2025",
                "foto": "DATAS_COMEMORATIVAS_EVENTOS/FACA.jpg",
                "cargo": "",
                "anoNascimento": "",
                "img_temp": "S",
                "link": "https://mototour.com.br/26-encontro-nacional-de-motociclistas"
            } // ATENÇÃO: É o último objeto do array, NÃO PODE TER VÍRGULA aqui.
        
        ];

        // Nomes dos meses em português
        const meses = [
            "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
            "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
        ];

        function obterMesAtual() {
            const dataAtual = new Date();
            return dataAtual.getMonth() + 1; // getMonth() retorna 0-11, então +1
        }

        function obterNomeMes(mes) {
            return meses[mes - 1];
        }

        function filtrarDatasDoMes(mes) {
            // Versão corrigida para lidar com datas temporárias (DD-MM-YYYY) ou recorrentes (DD-MM).
            const dataAtual = new Date();
            const diaAtual = dataAtual.getDate(); // Pega o dia de hoje (1 a 31)
            const anoAtual = dataAtual.getFullYear(); // Pega o ano atual (ex: 2025)

            return datasComemorativas.filter(data => {
                const isTemp = data.img_temp === 'S'; // Verifica se a data é temporária
                const dataParts = data.data.split('-'); // Divide a data (DD, MM ou DD, MM, YYYY)
                
                let diaEvento, mesEvento, anoEvento = anoAtual; // Define o ano como atual por padrão

                if (isTemp && dataParts.length === 3) {
                    // Formato temporário: DD-MM-YYYY
                    diaEvento = parseInt(dataParts[0]); //
                    mesEvento = parseInt(dataParts[1]); //
                    anoEvento = parseInt(dataParts[2]); //

                    // REGRA 1 (TEMPORÁRIA): Exibir SOMENTE se o ano informado for o atual
                    if (anoEvento !== anoAtual) { // Se o ano for diferente, ignora a data
                        return false;
                    }
                } else if (dataParts.length === 2) {
                    // Formato padrão (Recorrente): DD-MM
                    diaEvento = parseInt(dataParts[0]); //
                    mesEvento = parseInt(dataParts[1]); //
                    // anoEvento permanece como anoAtual
                } else {
                    // Ignora formatos inválidos
                    return false;
                }
                
                // REGRA 2: O mês do evento deve ser o mês atual
                if (mesEvento !== mes) { //
                    return false;
                }

                // REGRA 3: Se o mês for o atual, o dia do evento deve ser MAIOR OU IGUAL ao dia atual (não mostra datas passadas neste ano)
                return diaEvento >= diaAtual; //
            });
        }
        
        // --- FUNÇÃO CORRIGIDA: Implementa a lógica do link ---
        function criarCardData(data) {
            // Ajuste para formatar DD/MM ou DD/MM/YYYY no card
            const dataParts = data.data.split('-');
            const dia = dataParts[0];
            const mes = dataParts[1];
            // Inclui o ano no display da data se ele existir (formato DD/MM/YYYY)
            const ano = dataParts.length === 3 ? `/${dataParts[2]}` : ''; 
            
            const currentYear = new Date().getFullYear();
            const age = data.anoNascimento && data.anoNascimento !== "" ? currentYear - data.anoNascimento : null;
            const ageDisplay = age !== null ? `<p class="idade">${age} anos</p>` : '';

            // 1. O conteúdo principal do card
            const cardContent = `
                <img src="${data.foto}" alt="Foto de ${data.nome}" onerror="this.src='MEMBROS/FACA.png'">
                <h3>${data.nome}</h3>
                <p>${data.cargo}</p>
                ${ageDisplay}
                <p class="data-aniversario">${dia}/${mes}${ano}</p>
            `;

            // 2. Verifica se existe um link
            const eventLink = data.link ? data.link : null; 

            // 3. Decide se o card será uma âncora (link) ou uma div (estático)
            if (eventLink) {
                // É um link: retorna o conteúdo dentro de uma tag <a>
                return `
                    <a href="${eventLink}" target="_blank" class="data-card link-evento">
                        ${cardContent}
                    </a>
                `;
            } else {
                // Não é um link: retorna a div normal
                return `
                    <div class="data-card">
                        ${cardContent}
                    </div>
                `;
            }
        }
        // --- FIM DA FUNÇÃO CORRIGIDA ---


        function exibirDatasComemorativas() {
            const mesAtual = obterMesAtual();
            const nomeMesAtual = obterNomeMes(mesAtual);

            // Filtrar datas do mês atual
            const datasDoMes = filtrarDatasDoMes(mesAtual);

            const container = document.getElementById('datas-container');
            if (datasDoMes.length === 0) {
  //  caso não haja eventos nehum titulo sera adicionado ou se preferir escreva  o texo em     ">               </p>';                                  
                container.innerHTML = '<p style="text-align: center; color: var(--cor-branco); font-size: 1.2em; margin: 50px 0; grid-column: 1 / -1;">               </p>';
            } else {
                container.innerHTML = datasDoMes.map(data => criarCardData(data)).join('');
            }
        }


        // Carregar datas comemorativas quando a página carregar
        document.addEventListener('DOMContentLoaded', exibirDatasComemorativas);
    </script>
