<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FACA NA CAVEIRA MG | RJ-BRASIL</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png"> 
    <style>
        .secao-home {
            padding: 50px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .container-texto {
            text-align: center;
            margin-bottom: 20px;
        }
        .container-texto h2 {
            color: var(--cor-amarelo);
            font-family: var(--fonte-titulo);
            margin-bottom: 10px;
        }
        .container-texto p {
            color: var(--cor-branco);
            font-size: 1.1em;
            max-width: 800px;
            margin: 0 auto;
        }
        .datas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin: 0 auto;
            max-width: 1200px;
            justify-content: center;
        }
        .data-card {
            background-color: rgba(0, 0, 0, 0.9);
            border: 2px solid var(--cor-vermelho);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
            max-width: 300px;
            margin: 0 auto;
        }
        .data-card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.4);
        }
        .data-card img {
            width: 250px;
            height: 200px;
            border: 3px solid var(--cor-amarelo);
            margin-bottom: 15px;
            object-fit: cover;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .data-card h3 {
            color: var(--cor-amarelo);
            margin-bottom: 10px;
            font-family: var(--fonte-titulo);
            font-size: 1.3em;
            word-break: break-word;
        }
        .data-card p {
            color: var(--cor-branco);
            margin: 5px 0;
            font-size: 1em;
        }
        .data-aniversario {
            font-weight: bold;
            color: var(--cor-vermelho);
            font-size: 1.1em;
            margin-top: 10px;
        }
        .idade {
            color: var(--cor-amarelo);
            font-weight: bold;
            font-size: 1em;
            margin: 5px 0;
        }
    </style>
</head>
<body>

    <header class="cabecalho">
        <div class="logo-container">
            <a href="index.html"><img src="FACA.jpg"Logo Motogrupo Faca na Caveira MG RJ-BRASIL" class="logo"></a>
        </div>
        
        <nav class="menu-principal">
            <ul>
                <li><a href="index.html" class="ativo">HOME</a></li>
                <li><a href="galeria.html">GALERIA</a></li>
                <li><a href="historia.html">HISTÓRIA</a></li>
                <li><a href="rotas.html">ALBUM DE EVENTOS</a></li>
                <li><a href="irmandade.html">IRMANDADE</a></li>
                <li><a href="aniversariantes.html">ANIVERSARIANTES</a></li>
                <li><a href="junte-se.html">JUNTE-SE A NÓS</a></li>
                <li><a href="contato.html">CONTATO</a></li>
                <li><a href="administracao.html">ADMINISTRAÇÃO</a></li>


            </ul>
        </nav>
    </header>

    <main class="secao-home">
       
        <div class="datas-grid" id="datas-container">
            </div>
    </main>



    <footer class="rodape">
        <p>&copy; 2025 FACA NA CAVEIRA MG. ARRAIAL DO CABO  RJ-BRASIL.</p>
    </footer>

    <script>
        // Dados das datas comemorativas (apenas aquelas com foto em DATAS_COMEMORATIVAS_EVENTOS/)
        const datasComemorativas = [
            {
                //27-10
                "nome": "27 DE OUTUBRO ANIVERSÁRIO MOTOGRUPO FACA NA CAVEIRA - MG",
                "data": "27-10",
                "foto": "DATAS_COMEMORATIVAS_EVENTOS/FACA.png",
                "cargo": " ",
                "anoNascimento": 2013
            },
            {
                //27-07
                "nome": "27 DE JULHO DIA DO MOTOCICLISTA",
                "data": "27-07",
                "foto": "DATAS_COMEMORATIVAS_EVENTOS/DIA_MOTOCICICLSITA.jpg",
                "cargo": "",
                "anoNascimento": ""
            },
            {
                //13-07
                "nome": "13 DE JULHO DIA MUNDIAL DO ROCK",
                "data": "13-07",
                "foto": "DATAS_COMEMORATIVAS_EVENTOS/DIA_ROCK.png",
                "cargo": "",
                "anoNascimento": ""
            },
          
      {
                //           *****          EVENTO TEMPORARIO    *********************************
                "nome": "EVENTO TEMPORARIO TESTE",
                "data": "30-11-2025",
                "foto": "DATAS_COMEMORATIVAS_EVENTOS/DIA_ROCK.png",
                "cargo": "",
                "anoNascimento": ""
            },



          
            {
                "nome": "FACA NA CAVEIRA - MG  PARABENIZA  TODAS MULHERES APAIXONADAS PELO MOTOCICLISMO ",
                "data": "02-05",
                "foto": "DATAS_COMEMORATIVAS_EVENTOS/DIA_MULHER_MOTOCICLISTA.jpg",
                "cargo": "",
                "anoNascimento": ""
            },
     

            {
                "nome": "20 DE NOVEMBRO DIA NACIONAL DA CONSCIÊNCIA NEGRA",
                "data": "20-11",
                "foto": "DATAS_COMEMORATIVAS_EVENTOS/CONSCIENCIA_NEGRA.png",
                "cargo": "",
                "anoNascimento": ""
            }





        ];

        // Nomes dos meses em português
        const meses = [
            "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
            "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"
        ];

        function obterMesAtual() {
            const dataAtual = new Date();
            return dataAtual.getMonth() + 1; // getMonth() retorna 0-11, então +1
        }

        function obterNomeMes(mes) {
            return meses[mes - 1];
        }

        function filtrarDatasDoMes(mes) {
            // Versão anterior:
            /*
            return datasComemorativas.filter(data => {
                const mesData = parseInt(data.data.split('-')[1]);
                return mesData === mes;
            });
            */
            
            // Versão corrigida para não exibir datas que já passaram:
            const dataAtual = new Date();
            const diaAtual = dataAtual.getDate(); // Pega o dia de hoje (1 a 31)

            return datasComemorativas.filter(data => {
                const [diaEventoStr, mesEventoStr] = data.data.split('-');
                const diaEvento = parseInt(diaEventoStr);
                const mesEvento = parseInt(mesEventoStr);
                
                // 1. O mês do evento deve ser o mês atual
                if (mesEvento !== mes) {
                    return false;
                }

                // 2. Se o mês for o atual, o dia do evento deve ser MAIOR OU IGUAL ao dia atual
                return diaEvento >= diaAtual;
            });
        }

        function criarCardData(data) {
            const [dia, mes] = data.data.split('-');
            const currentYear = new Date().getFullYear();
            const age = data.anoNascimento && data.anoNascimento !== "" ? currentYear - data.anoNascimento : null;
            const ageDisplay = age !== null ? `<p class="idade">${age} anos</p>` : '';
            return `
                <div class="data-card">
                    <img src="${data.foto}" alt="Foto de ${data.nome}" onerror="this.src='MEMBROS/FACA.png'">
                    <h3>${data.nome}</h3>
                    <p>${data.cargo}</p>
                    ${ageDisplay}
                    <p class="data-aniversario">${dia}/${mes}</p>
                </div>
            `;
        }

        function exibirDatasComemorativas() {
            const mesAtual = obterMesAtual();
            const nomeMesAtual = obterNomeMes(mesAtual);

            // Filtrar datas do mês atual
            const datasDoMes = filtrarDatasDoMes(mesAtual);

            const container = document.getElementById('datas-container');
            if (datasDoMes.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--cor-branco); font-size: 1.2em; margin: 50px 0; grid-column: 1 / -1;">Nenhuma data comemorativa neste mês. Mas a estrada nos reserva muitas surpresas!</p>';
            } else {
                container.innerHTML = datasDoMes.map(data => criarCardData(data)).join('');
            }
        }


        // Carregar datas comemorativas quando a página carregar
        document.addEventListener('DOMContentLoaded', exibirDatasComemorativas);
    </script>

</body>
</html>
