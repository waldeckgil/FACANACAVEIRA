<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FACA NA CAVEIRA MG | RJ-BRASIL</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png"> 
    <style>
        .secao-home {
            padding: 50px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .container-texto {
            text-align: center;
            margin-bottom: 20px;
        }
        .container-texto h2 {
            color: var(--cor-amarelo);
            font-family: var(--fonte-titulo);
            margin-bottom: 10px;
        }
        .container-texto p {
            color: var(--cor-branco);
            font-size: 1.1em;
            max-width: 800px;
            margin: 0 auto;
        }
        .datas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin: 0 auto;
            max-width: 1200px;
            justify-content: center;
        }
        .data-card {
            background-color: rgba(0, 0, 0, 0.9);
            border: 2px solid var(--cor-vermelho);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.2);
            max-width: 300px;
            margin: 0 auto;
        }
        .data-card:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.4);
        }

        /* ALTERAÇÃO: Adicionado seletor 'video' para compartilhar o mesmo estilo da imagem */
        .data-card img, .data-card video {
            width: 250px;
            height: 200px;
            border: 3px solid var(--cor-amarelo);
            margin-bottom: 15px;
            object-fit: cover;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .data-card h3 {
            color: var(--cor-amarelo);
            margin-bottom: 10px;
            font-family: var(--fonte-titulo);
            font-size: 1.3em;
            word-break: break-word;
        }
        .data-card p {
            color: var(--cor-branco);
            margin: 5px 0;
            font-size: 1em;
        }
        .data-aniversario {
            font-weight: bold;
            color: var(--cor-vermelho);
            font-size: 1.1em;
            margin-top: 10px;
        }
        .idade {
            color: var(--cor-amarelo);
            font-weight: bold;
            font-size: 1em;
            margin: 5px 0;
        }
        .link-evento {
            text-decoration: none;
            color: inherit;
            display: block;
            cursor: pointer;
        }
        .link-evento:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header class="cabecalho">
        <div class="logo-container">
            <a href="index.html">
                <img src="FACA.jpg" alt="Logo Motogrupo Faca na Caveira MG RJ-BRASIL" class="logo">
            </a>
        </div>
        
        <nav class="menu-principal">
            <ul>
                <li><a href="index.html" class="ativo">HOME</a></li>
                <li><a href="galeria.html">GALERIA</a></li>
                <li><a href="historia.html">HISTÓRIA</a></li>
                <li><a href="rotas.html">FACA_NA_CAVEIRA </a></li>
                <li><a href="irmandade.html">IRMANDADE</a></li>
                <li><a href="aniversariantes.html">ANIVERSARIANTES</a></li>
                <li><a href="contato.html">CONTATO</a></li>
                <li><a href="administracao.html">ADMINISTRAÇÃO</a></li>
            </ul>
        </nav>
    </header>

    <main class="secao-home">
        <div class="datas-grid" id="datas-container"></div>
    </main>

    <footer class="rodape">
        <p>&copy; 2025 FACA NA CAVEIRA MG. ARRAIAL DO CABO RJ-BRASIL.</p>
    </footer>

    <script>
        const datasComemorativas = [
            {
                "nome": "FACA NA CAVEIRA - MG PARABENIZA TODAS MULHERES APAIXONADAS PELO MOTOCICLISMO ",

                "foto": "DATAS_COMEMORATIVAS_EVENTOS/DIA_MULHER_MOTOCICLISTA.jpg",
                "cargo": "",
                "anoNascimento": "",
                "img_temp": "N"
            },
            {
                "nome": "13 DE JULHO DIA MUNDIAL DO ROCK",
                "data": "13-07",
                "foto": "DATAS_COMEMORATIVAS_EVENTOS/DIA_ROCK.png",
                "cargo": "",
                "anoNascimento": "",
                "img_temp": "N"
            },
            {
                "nome": "27 DE JULHO DIA DO MOTOCICLISTA",
                "data": "27-07",
                "foto": "DATAS_COMEMORATIVAS_EVENTOS/DIA_MOTOCICICLSITA.jpg",
                "cargo": "",
                "anoNascimento": "",
                "img_temp": "N"
            },
            {
                "nome": "27 DE OUTUBRO ANIVERSÁRIO MOTOGRUPO FACA NA CAVEIRA - MG",
                "data": "27-10",
                "foto": "DATAS_COMEMORATIVAS_EVENTOS/FACA.png",
                "cargo": " ",
                "anoNascimento": 2013,
                "img_temp": "N"
            },
            {
                "nome": "MG FACA NA CAVEIRA DESEJA UM FELIZ NATAL A TODOS OS IRMÃOS ! ",
                "data": "25-12",
                "foto": "DATAS_COMEMORATIVAS_EVENTOS/FLYER_DE_NATAL.jpg",
                "cargo": " ",
                "anoNascimento": "",
                "img_temp": "N"
            },
            {
                "nome": "MG FACA NA CAVEIRA DESEJA UM FELIZ ANO NOVO A TODOS OS IRMÃOS ! ",
                "data": "31-12",
                "foto": "DATAS_COMEMORATIVAS_EVENTOS/FLYER_DE_ANO_NOVO.mp4", // O sistema agora detecta o .mp4 aqui
                "cargo": " ",
                "anoNascimento": "",
                "img_temp": "N"
            },
            {
                "nome": "VIAGEM DO ROCK MOTO FEST - Tanguá - RJ 16 a 18 de Janeiro ",
                "data": "18-01-2026",
                "foto": "DATAS_COMEMORATIVAS_EVENTOS/MOTO_FEST_TANGUA_TEMP.jpeg",
                "cargo": "",
                "anoNascimento": "",
                "img_temp": "S"
            },
            {
                "nome": "XXIX OSTRAS CYCLE - ENCONTRO INTERNACIONAL DE MOTOCICICLISTAS - 15 a 19 de Abril ",
                "data": "19-04-2026",
                "foto": "DATAS_COMEMORATIVAS_EVENTOS/TEMP_OstrasCycle2026.png",
                "cargo": "",
                "anoNascimento": "",
                "img_temp": "S"
            },
            {
                "nome": "20 DE NOVEMBRO DIA NACIONAL DA CONSCIÊNCIA NEGRA",
                "data": "20-11",
                "foto": "DATAS_COMEMORATIVAS_EVENTOS/CONSCIENCIA_NEGRA.png",
                "cargo": "",
                "anoNascimento": "",
                "img_temp": "N"
            },
            {
                "nome": "1º Trajano Moto Fest De 10 à 12 de Julho - Clique Aqui",
                "data": "12-07-2026",
                "foto": "DATAS_COMEMORATIVAS_EVENTOS/TEMP-28062026-TRAJANO-MOTOFEST.png",
                "cargo": "Trajano de Moraes /RJ - Brasil",
                "anoNascimento": "",
                "img_temp": "S",
                "link": "https://mototour.com.br/1-trajano-moto-fest"
            },
            {
                "nome": "26º Encontro Nacional de Motociclistas De 05 à 08 de Fevereiro - Clique Aqui",
                "data": "08-02-2026",
                "foto": "DATAS_COMEMORATIVAS_EVENTOS/FACA.jpg",
                "cargo": "Barbacena MG",
                "anoNascimento": "",
                "img_temp": "S",
                "link": "https://mototour.com.br/26-encontro-nacional-de-motociclistas"
            }
        ];

        const meses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

        function obterMesAtual() {
            return new Date().getMonth() + 1;
        }

        function obterNomeMes(mes) {
            return meses[mes - 1];
        }

        function filtrarDatasDoMes(mes) {
            const dataAtual = new Date();
            const diaAtual = dataAtual.getDate();
            const anoAtual = dataAtual.getFullYear();

            return datasComemorativas.filter(data => {
                const isTemp = data.img_temp === 'S';
                const dataParts = data.data.split('-');
                let diaEvento, mesEvento, anoEvento = anoAtual;

                if (isTemp && dataParts.length === 3) {
                    diaEvento = parseInt(dataParts[0]);
                    mesEvento = parseInt(dataParts[1]);
                    anoEvento = parseInt(dataParts[2]);
                    if (anoEvento !== anoAtual) return false;
                } else if (dataParts.length === 2) {
                    diaEvento = parseInt(dataParts[0]);
                    mesEvento = parseInt(dataParts[1]);
                } else {
                    return false;
                }
                
                if (mesEvento !== mes) return false;
                return diaEvento >= diaAtual;
            });
        }
        
        function criarCardData(data) {
            const dataParts = data.data.split('-');
            const dia = dataParts[0];
            const mes = dataParts[1];
            const ano = dataParts.length === 3 ? `/${dataParts[2]}` : ''; 
            
            const currentYear = new Date().getFullYear();
            const age = data.anoNascimento && data.anoNascimento !== "" ? currentYear - data.anoNascimento : null;
            const ageDisplay = age !== null ? `<p class="idade">${age} anos</p>` : '';

            // --- INÍCIO DAS LINHAS ALTERADAS ---
            // ALTERAÇÃO: Adicionada detecção de extensão para decidir entre imagem ou vídeo
            const ehVideo = data.foto.toLowerCase().endsWith('.mp4');
            
            // ALTERAÇÃO: Se for vídeo, usa a tag <video> com autoplay e loop. Se não, usa <img>.
            const midiaHTML = ehVideo 
                ? `<video src="${data.foto}" autoplay loop muted playsinline></video>`
                : `<img src="${data.foto}" alt="Foto de ${data.nome}" onerror="this.src='FACA.jpg'">`;
            // --- FIM DAS LINHAS ALTERADAS ---

            const cardContent = `
                ${midiaHTML}
                <h3>${data.nome}</h3>
                <p>${data.cargo}</p>
                ${ageDisplay}
                <p class="data-aniversario">${dia}/${mes}${ano}</p>
            `;

            const eventLink = data.link ? data.link : null; 

            if (eventLink) {
                return `<a href="${eventLink}" target="_blank" class="data-card link-evento">${cardContent}</a>`;
            } else {
                return `<div class="data-card">${cardContent}</div>`;
            }
        }

        function exibirDatasComemorativas() {
            const mesAtual = obterMesAtual();
            const datasDoMes = filtrarDatasDoMes(mesAtual);
            const container = document.getElementById('datas-container');
            
            if (datasDoMes.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--cor-branco); font-size: 1.2em; margin: 50px 0; grid-column: 1 / -1;"></p>';
            } else {
                container.innerHTML = datasDoMes.map(data => criarCardData(data)).join('');
            }
        }

        document.addEventListener('DOMContentLoaded', exibirDatasComemorativas);
    </script>
</body>
</html>
